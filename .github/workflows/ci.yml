name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python3 -m py_compile src/atmovio/app.py src/atmovio/storage_guard.py
      - name: Built scripts match sources
        run: bash src/build.sh --check
      - name: Shell syntax
        run: bash -n install.sh && bash -n update-atmovio.sh
      - name: Templates parse and app imports
        run: |
          python3 -m pip install -q -r src/atmovio/requirements.txt
          mkdir -p /tmp/sw
          ATMOVIO_DIR=/tmp/sw ATMOVIO_ADMIN_PASSWORD=ci-password-12345 python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "src/atmovio")
          import app
          for name in app.TEMPLATES:
              app.jenv.get_template(name)
          print("templates OK:", len(app.TEMPLATES))
          app.watcher.running = False; app.watcher.stop_event.set()
          PY
      - name: Offline administration regression checks
        run: |
          python3 -m pip install -q httpx
          python3 tests/regression.py
          python3 tests/ai_films.py
          python3 tests/video_ranges.py
          python3 tests/storage_guard.py
      - name: No personal data in sources
        run: |
          # heslo zapsané natvrdo (ne odkaz na proměnnou jako PASSWORD="$ADMIN_PW")
          ! grep -rniE "vladimir-vecera|@gmail\.com|password *= *['\"][^'\"$]{4,}" src/ --include=*.py --include=*.sh --include=*.js --include=*.css
      - name: PHP example syntax
        run: |
          sudo apt-get install -y -q php-cli >/dev/null
          for f in examples/*/*.php; do php -l "$f"; done
